<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="F1 Hungary">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#E10600">
  <meta name="description" content="Race weekend trip planner voor de Hongaarse Grand Prix 2026">
  <title>F1 Hungary 2026</title>

  <!-- PWA manifest + icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="img/icon.svg">
  <link rel="apple-touch-icon" href="img/icon.svg">
  <link rel="mask-icon" href="img/icon.svg" color="#E10600">

  <!-- Motorsport display font (Titillium Web) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">

  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <div class="header-flag-pattern"></div>
    <h1 class="app-title">
      <span class="title-f1">F1</span> HUNGARIAN GP <span class="title-year">2026</span>
    </h1>
    <p class="app-subtitle">Hungaroring &middot; Budapest</p>
  </header>

  <!-- Tab Contents -->
  <main class="app-main">

    <!-- Dashboard -->
    <section id="tab-dashboard" class="tab-content active">
      <div id="dashboard-content"></div>
    </section>

    <!-- Roadtrip (was: Reis) -->
    <section id="tab-roadtrip" class="tab-content">
      <div id="roadtrip-content"></div>
    </section>

    <!-- Results (F1 Race Results) -->
    <section id="tab-results" class="tab-content">
      <div id="results-content"></div>
    </section>

    <!-- Circuit (was: Info) -->
    <section id="tab-circuit" class="tab-content">
      <div id="circuit-content"></div>
    </section>

    <!-- Map -->
    <section id="tab-map" class="tab-content">
      <div id="map-container"></div>
      <div class="map-controls">
        <button class="map-btn" id="map-fit-all" title="Alles tonen">
          <span>&#x1F50D;</span> Alles tonen
        </button>
        <button class="map-btn" id="map-set-hotel" title="Hotel pin plaatsen">
          <span>&#x1F4CD;</span> Hotel pin
        </button>
      </div>
      <div id="map-set-hotel-hint" class="map-hint hidden">Tik op de kaart om je hotel te markeren</div>
    </section>

    <!-- Group -->
    <section id="tab-group" class="tab-content">
      <div id="group-content"></div>
    </section>

  </main>

  <!-- Bottom Navigation -->
  <nav class="tab-nav" role="tablist">
    <button class="tab-nav-item active" data-tab="tab-dashboard" role="tab" aria-selected="true">
      <span class="nav-icon">&#x1F3E0;</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="tab-nav-item" data-tab="tab-roadtrip" role="tab" aria-selected="false">
      <span class="nav-icon">&#x1F697;</span>
      <span class="nav-label">Roadtrip</span>
    </button>
    <button class="tab-nav-item" data-tab="tab-results" role="tab" aria-selected="false">
      <span class="nav-icon">&#x1F3C6;</span>
      <span class="nav-label">Uitslagen</span>
    </button>
    <button class="tab-nav-item" data-tab="tab-circuit" role="tab" aria-selected="false">
      <span class="nav-icon">&#x1F3CE;&#xFE0F;</span>
      <span class="nav-label">Circuit</span>
    </button>
    <button class="tab-nav-item" data-tab="tab-map" role="tab" aria-selected="false">
      <span class="nav-icon">&#x1F5FA;&#xFE0F;</span>
      <span class="nav-label">Kaart</span>
    </button>
    <button class="tab-nav-item" data-tab="tab-group" role="tab" aria-selected="false">
      <span class="nav-icon">&#x1F465;</span>
      <span class="nav-label">Groep</span>
    </button>
  </nav>

  <!-- Translate FAB -->
  <button id="translate-fab" class="translate-fab" title="Vertaal naar Hongaars" aria-label="Vertaal naar Hongaars">
    <span class="translate-fab-icon">&#x1F5E3;&#xFE0F;</span>
    <span class="translate-fab-label">Vertaal <span class="translate-fab-flag">&#x1F1ED;&#x1F1FA;</span></span>
  </button>

  <!-- Translate Modal -->
  <div id="translate-modal" class="translate-modal" role="dialog" aria-modal="true" aria-labelledby="translate-title">
    <div id="translate-backdrop" class="translate-backdrop"></div>
    <div class="translate-sheet">
      <div class="translate-header">
        <div class="translate-header-title" id="translate-title">
          <span class="translate-flag">&#x1F1F3;&#x1F1F1; &rarr; &#x1F1ED;&#x1F1FA;</span>
          <span>Vertaal</span>
        </div>
        <button id="translate-close" class="translate-close" aria-label="Sluiten">&times;</button>
      </div>

      <div class="translate-body">
        <label class="translate-label" for="translate-input">Wat wil je zeggen? (Nederlands)</label>
        <textarea id="translate-input" class="translate-input" rows="2" placeholder="Bijv. Twee bier, alstublieft"></textarea>
        <div class="translate-actions-row">
          <button id="translate-btn" class="translate-btn">Vertaal</button>
          <button id="translate-mic" class="translate-mic" aria-label="Spreek in" title="Spreek in het Nederlands">
            <span class="translate-mic-icon">&#x1F3A4;</span>
          </button>
        </div>
        <div id="translate-voice-status" class="translate-voice-status hidden"></div>

        <div id="translate-result" class="translate-result">
          <div class="translate-result-label">Hongaars</div>
          <div id="translate-result-text" class="translate-result-text"></div>
          <div class="translate-result-actions">
            <button id="translate-speak" class="translate-action-btn">&#x1F50A; Uitspraak</button>
            <button id="translate-copy" class="translate-action-btn">&#x1F4CB; Kopieer</button>
          </div>
        </div>

        <div id="translate-quick" class="translate-quick"></div>

        <div id="translate-history" class="translate-history"></div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/map.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/results.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/translate.js"></script>
  <script src="js/push.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
