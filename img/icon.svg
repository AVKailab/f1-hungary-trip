<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Full bleed red background (maskable-safe) -->
  <rect width="512" height="512" fill="#E10600"/>

  <!-- Subtle checker pattern stripe at top -->
  <g opacity="0.15">
    <rect x="0" y="0" width="64" height="64" fill="#000"/>
    <rect x="128" y="0" width="64" height="64" fill="#000"/>
    <rect x="256" y="0" width="64" height="64" fill="#000"/>
    <rect x="384" y="0" width="64" height="64" fill="#000"/>
    <rect x="64" y="64" width="64" height="64" fill="#000"/>
    <rect x="192" y="64" width="64" height="64" fill="#000"/>
    <rect x="320" y="64" width="64" height="64" fill="#000"/>
    <rect x="448" y="64" width="64" height="64" fill="#000"/>
  </g>

  <!-- F1 text -->
  <text x="256" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="180" font-weight="900" fill="white"
        text-anchor="middle" dominant-baseline="middle" letter-spacing="-4">F1</text>

  <!-- 2026 badge -->
  <text x="256" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Arial, sans-serif"
        font-size="52" font-weight="800" fill="white"
        text-anchor="middle" dominant-baseline="middle" letter-spacing="6">2026</text>

  <!-- Hungarian flag accent bar -->
  <g transform="translate(166, 420)">
    <rect x="0" y="0" width="180" height="10" fill="#CE2939"/>
    <rect x="0" y="10" width="180" height="10" fill="#FFFFFF"/>
    <rect x="0" y="20" width="180" height="10" fill="#477050"/>
  </g>
</svg>
